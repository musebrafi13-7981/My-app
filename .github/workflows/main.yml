name: Build Android APK from Release ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download & Extract Release ZIP
        run: |
          curl -L -o micro.zip https://github.com/musebrafi13-7981/My-app/releases/download/v1.0/micro.zip
          unzip micro.zip
          ls -la

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -d android ]; then
            cd android && chmod +x gradlew && ./gradlew assembleRelease
          else
            npx expo run:android --variant release || npm run build
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            *.apk

            
