name: Build Android APK from Release ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & Extract Release ZIP
        run: |
          curl -L -o micro.zip https://github.com/musebrafi13-7981/My-app/releases/download/v1.0/micro.zip
          unzip -o micro.zip -d extracted_app
          
          PKG_PATH=$(find extracted_app -name "package.json" -type f | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PROJECT_DIR=$(dirname "$PKG_PATH")
            cp -r "$PROJECT_DIR"/. .
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install expo @expo/cli react-router-dom react-router-native --save-dev --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          ACTUAL_APP=$(find . -not -path '*/node_modules/*' -not -path '*/android/*' -not -path '*/ios/*' \( -name "App.js" -o -name "App.tsx" -o -name "App.jsx" -o -name "index.js" -o -name "index.tsx" \) | head -n 1)
          
          if [ -n "$ACTUAL_APP" ]; then
            CLEAN_PATH=$(echo "$ACTUAL_APP" | sed 's|^\./||')
            node -e "const p=require('./package.json'); p.main='$CLEAN_PATH'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          fi

          if [ ! -f "index.js" ] && [ ! -f "index.ts" ]; then
            echo "import { registerRootComponent } from 'expo'; import App from './$CLEAN_PATH'; registerRootComponent(App);" > index.js
            node -e "const p=require('./package.json'); p.main='index.js'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          fi

          npx expo prebuild --platform android --no-install
          npm install --legacy-peer-deps
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
