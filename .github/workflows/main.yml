name: Build Android APK from Release ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & Extract Release ZIP
        run: |
          curl -L -o micro.zip https://github.com/musebrafi13-7981/My-app/releases/download/v1.0/micro.zip
          unzip -o micro.zip -d extracted_app
          PKG_PATH=$(find extracted_app -name "package.json" -type f | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PROJECT_DIR=$(dirname "$PKG_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install expo @expo/cli --save-dev --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          npx expo prebuild --platform android --no-install
          
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Failed to generate android directory"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            *.apk
