name: Build Android APK from Release ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & Extract Release ZIP
        run: |
          curl -L -o micro.zip https://github.com/musebrafi13-7981/My-app/releases/download/v1.0/micro.zip
          unzip -o micro.zip -d extracted_app
          PKG_PATH=$(find extracted_app -name "package.json" -type f | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PROJECT_DIR=$(dirname "$PKG_PATH")
            cp -r "$PROJECT_DIR"/. .
            
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install expo @expo/cli --save-dev --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          ENTRY_FILE=$(find . -maxdepth 2 -name "index.js" -o -name "index.ts" -o -name "App.js" -o -name "App.tsx" | head -n 1)
          if [ -n "$ENTRY_FILE" ]; then
            node -e "const p=require('./package.json'); p.main='$ENTRY_FILE'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2));"
          fi
          
          if [ ! -f "App.js" ] && [ ! -f "App.tsx" ] && [ ! -f "App.jsx" ]; then
            echo "import { registerRootComponent } from 'expo'; import App from '${ENTRY_FILE:-./index}'; registerRootComponent(App);" > App.js
          fi

          npx expo prebuild --platform android --no-install
          npm install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            *.apk

            
