name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate Project & Install Dependencies
        run: |
          PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PACKAGE_PATH" ]; then
            echo "ERROR: package.json nahi mili repo me!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Pre-bundle JS & Assets
        run: |
          cd "$PROJECT_DIR"
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease -x test --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "ERROR: android folder nahi mila!"
            exit 1
          fi

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/android/app/build/outputs/apk/release/*.apk
            **/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
